---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-domain
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "48h0m0s"
  target:
    name: cluster-secrets
  data:
    - secretKey: SECRET_DOMAIN
      remoteRef:
        key: cloudflare/domain
