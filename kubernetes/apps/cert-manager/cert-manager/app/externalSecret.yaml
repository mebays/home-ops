---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-issuer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cert-manager-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare_kube_token/credential
