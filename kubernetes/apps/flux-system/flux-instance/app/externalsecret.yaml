---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "48h0m0s"
  target:
    name: github-webhook-token-secret
  data:
    - secretKey: token
      remoteRef:
        key: github_webhook/token
