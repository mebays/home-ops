---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "48h0m0s"
  target:
    name: cloudflare-dns-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare_kube_token/credential
